<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DopaMAXX</title>
  <style>
    :root {
      --bg:      #141414;
      --surface: #1e1e1e;
      --line:    #2a2a2a;
      --text:    #f0ede8;
      --sub:     #6b6b6b;
      --accent:  #e8560a;
      --on:      #3ecf6a;
      --off:     #6b6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── wordmark row ── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text);
    }

    .live-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sub);
    }
    .live-dot span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--sub);
    }
    .live-dot.on { color: var(--on); }
    .live-dot.on span {
      background: var(--on);
      box-shadow: 0 0 0 3px rgba(62,207,106,0.15);
    }

    /* ── mode block ── */
    .mode-block {
      padding: 22px 20px 20px;
      border-bottom: 1px solid var(--line);
    }

    .mode-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sub);
      margin-bottom: 6px;
    }

    .mode-name {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.02em;
      color: var(--text);
      line-height: 1;
      margin-bottom: 14px;
    }
    .mode-name.active { color: var(--accent); font-weight: 500; }

    /* ── metrics row ── */
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
    }

    .metric {
      padding: 0;
    }
    .metric + .metric {
      padding-left: 20px;
      border-left: 1px solid var(--line);
      margin-left: 0;
    }

    .metric-val {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 4px;
    }
    .metric-val.dim { color: var(--sub); font-weight: 300; }

    .metric-lbl {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sub);
    }

    /* ── demo block ── */
    .demo-block {
      padding: 16px 20px 20px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .ctrl-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sub);
    }

    /* toggle */
    .toggle { position: relative; width: 34px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .track {
      position: absolute; inset: 0;
      background: var(--line);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .track:before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      top: 3px; left: 3px;
      background: var(--sub);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .track { background: rgba(232,86,10,0.2); }
    input:checked + .track:before { transform: translateX(14px); background: var(--accent); }

    /* button */
    .btn {
      width: 100%;
      padding: 10px 0;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: transparent;
      color: var(--sub);
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn:not(:disabled):hover { border-color: var(--text); color: var(--text); }
    .btn:active:not(:disabled) { opacity: 0.7; }
    .btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .btn.armed {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn.armed:not(:disabled):hover { background: rgba(232,86,10,0.06); }
  </style>
</head>
<body>

  <div class="top">
    <span class="wordmark">DopaMAXX</span>
    <span class="live-dot" id="eegDot"><span></span><span id="eegTxt">offline</span></span>
  </div>

  <div class="mode-block">
    <div class="mode-label">Mode</div>
    <div class="mode-name" id="modeName">Locked Out</div>
    <div class="metrics">
      <div class="metric">
        <div class="metric-val dim" id="timerVal">--:--</div>
        <div class="metric-lbl">Timer</div>
      </div>
      <div class="metric">
        <div class="metric-val dim" id="focusVal">—</div>
        <div class="metric-lbl">Focus</div>
      </div>
      <div class="metric">
        <div class="metric-val dim" id="rewardVal">—</div>
        <div class="metric-lbl">Reward</div>
      </div>
    </div>
  </div>

  <div class="demo-block">
    <div class="row">
      <span class="ctrl-label">Demo Override</span>
      <label class="toggle">
        <input type="checkbox" id="demoToggle" />
        <span class="track"></span>
      </label>
    </div>
    <button class="btn" id="switchBtn" disabled>Switch Mode</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
