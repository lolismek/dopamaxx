<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DopaMAXX</title>
  <style>
    :root {
      --bg:      #121212;
      --s1:      #1a1a1a;
      --s2:      #222222;
      --line:    rgba(255,255,255,0.07);
      --text:    #e0deda;
      --sub:     #5a5a5a;
      --accent:  #e8560a;
      --live:    #3ecf6a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
      flex-shrink: 0;
    }

    .eeg-status {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .eeg-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--sub);
      flex-shrink: 0;
    }
    .eeg-text {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sub);
    }
    .eeg-status.live .eeg-dot  { background: var(--live); }
    .eeg-status.live .eeg-text { color: var(--live); }

    /* ── mode section ── */
    .mode-section {
      padding: 24px 16px;
      border-bottom: 1px solid var(--line);
    }

    .section-eyebrow {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sub);
      margin-bottom: 4px;   /* tight — eyebrow belongs to the name below it */
    }

    .mode-name {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 0.01em;
      color: var(--text);
      line-height: 1;
      margin-bottom: 24px;  /* large gap — separates primary from secondary */
      transition: color 0.2s;
    }
    .mode-name.active {
      color: var(--accent);
      font-weight: 500;
    }

    /* ── metrics ── */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .metric { padding: 0; }
    .metric + .metric {
      padding-left: 16px;
      border-left: 1px solid var(--line);
    }

    .metric-val {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 5px;
      transition: color 0.2s;
    }
    .metric-val.dim { color: var(--sub); font-weight: 300; }

    .metric-lbl {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sub);
    }

    /* ── demo section ── */
    .demo-section {
      padding: 16px;
    }

    .demo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .ctrl-eyebrow {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sub);
    }

    /* toggle */
    .toggle { position: relative; width: 34px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .track {
      position: absolute; inset: 0;
      background: var(--s2);
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .track:before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      top: 2px; left: 2px;
      background: var(--sub);
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }
    input:checked + .track {
      background: rgba(232,86,10,0.15);
      border-color: rgba(232,86,10,0.3);
    }
    input:checked + .track:before {
      transform: translateX(14px);
      background: var(--accent);
    }

    /* button */
    .btn {
      width: 100%;
      padding: 11px 0;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      color: var(--sub);
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .btn:disabled { opacity: 0.2; cursor: not-allowed; }
    .btn:not(:disabled):hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
    .btn:active:not(:disabled) { opacity: 0.6; }
    .btn.armed {
      border-color: rgba(232,86,10,0.4);
      color: var(--accent);
    }
    .btn.armed:not(:disabled):hover {
      background: rgba(232,86,10,0.06);
      border-color: rgba(232,86,10,0.6);
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="wordmark">DopaMAXX</span>
    <span class="eeg-status" id="eegStatus">
      <span class="eeg-dot"></span>
      <span class="eeg-text" id="eegText">Offline</span>
    </span>
  </div>

  <div class="mode-section">
    <div class="section-eyebrow">Mode</div>
    <div class="mode-name" id="modeName">Locked Out</div>
    <div class="metrics">
      <div class="metric">
        <div class="metric-val dim" id="timerVal">--:--</div>
        <div class="metric-lbl">Timer</div>
      </div>
      <div class="metric">
        <div class="metric-val dim" id="focusVal">—</div>
        <div class="metric-lbl">Focus</div>
      </div>
      <div class="metric">
        <div class="metric-val dim" id="rewardVal">—</div>
        <div class="metric-lbl">Reward</div>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-row">
      <span class="ctrl-eyebrow">Demo Override</span>
      <label class="toggle">
        <input type="checkbox" id="demoToggle" />
        <span class="track"></span>
      </label>
    </div>
    <button class="btn" id="switchBtn" disabled>Switch Mode</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
