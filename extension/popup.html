<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DopaMAXX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e8e8f0;
    }

    .header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid #1e1e2e;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .logo span { color: #7c3aed; }

    .ws-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 600;
      letter-spacing: 0.04em;
      float: right;
      margin-top: 3px;
    }
    .ws-badge.connected { background: #14532d; color: #4ade80; }
    .ws-badge.disconnected { background: #2a1a1a; color: #f87171; }

    .mode-block {
      padding: 20px;
      text-align: center;
    }

    .mode-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #6b6b80;
      margin-bottom: 8px;
    }

    .mode-pill {
      display: inline-block;
      padding: 6px 22px;
      border-radius: 99px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }
    .mode-pill.locked-in  { background: #3b0764; color: #e9d5ff; }
    .mode-pill.locked-out { background: #052e16; color: #bbf7d0; }

    .timer {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #a5b4fc;
      font-variant-numeric: tabular-nums;
    }

    .divider { border: none; border-top: 1px solid #1e1e2e; margin: 0 20px; }

    .demo-section {
      padding: 16px 20px;
    }

    .demo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .demo-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b6b80;
    }

    /* Toggle switch */
    .toggle-wrap { display: flex; align-items: center; gap: 8px; }
    .toggle-label { font-size: 11px; color: #6b6b80; }
    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #2a2a3a;
      border-radius: 99px;
      transition: background 0.2s;
    }
    .slider:before {
      content: '';
      position: absolute;
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #7c3aed; }
    input:checked + .slider:before { transform: translateX(16px); }

    .demo-btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.03em;
    }
    .demo-btn:active { transform: scale(0.97); }
    .demo-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .demo-btn.to-locked-in  { background: #7c3aed; color: #fff; }
    .demo-btn.to-locked-out { background: #16a34a; color: #fff; }

    .demo-note {
      margin-top: 8px;
      font-size: 10px;
      color: #4b4b60;
      text-align: center;
    }

    .footer {
      padding: 8px 20px 14px;
      font-size: 10px;
      color: #3a3a50;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">Dopa<span>MAXX</span></span>
    <span class="ws-badge disconnected" id="wsBadge">EEG offline</span>
  </div>

  <div class="mode-block">
    <div class="mode-label">Current mode</div>
    <div class="mode-pill locked-out" id="modePill">LOCKED OUT</div>
    <div class="timer" id="timer">—</div>
  </div>

  <hr class="divider" />

  <div class="demo-section">
    <div class="demo-header">
      <span class="demo-title">Demo Mode</span>
      <label class="toggle-wrap">
        <span class="toggle-label" id="demoLabel">off</span>
        <label class="toggle">
          <input type="checkbox" id="demoToggle" />
          <span class="slider"></span>
        </label>
      </label>
    </div>

    <button class="demo-btn to-locked-in" id="switchBtn" disabled>
      Switch to LOCKED IN
    </button>
    <div class="demo-note" id="demoNote">Enable demo mode to manually control transitions</div>
  </div>

  <div class="footer">transitions driven by EEG when demo mode is off</div>

  <script src="popup.js"></script>
</body>
</html>
