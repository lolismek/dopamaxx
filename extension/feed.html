<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DopaMAXX Microdose</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #161922;
      --surface-2: #1c2030;
      --border: #252a3a;
      --green: #22c55e;
      --orange: #f97316;
      --blue: #3b82f6;
      --text: #f1f5f9;
      --muted: #64748b;
      --muted-2: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-width: 420px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    .shell {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .wordmark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .wordmark em { color: var(--green); font-style: normal; }

    .badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--orange);
      text-transform: uppercase;
    }

    .feed {
      display: grid;
      gap: 9px;
    }

    .post {
      display: grid;
      gap: 8px;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .post-head,
    .post-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
    }

    .rank { color: var(--blue); font-weight: 700; }

    .score { color: var(--green); }

    .post-text {
      font-size: 12px;
      line-height: 1.55;
      color: var(--text);
      white-space: pre-wrap;
    }

    .rationale {
      color: var(--muted-2);
      font-size: 10px;
      line-height: 1.45;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    button {
      padding: 8px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      text-transform: uppercase;
    }

    button.primary {
      background: rgba(34,197,94,0.12);
      border-color: rgba(34,197,94,0.28);
      color: var(--green);
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    .empty {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="header">
      <span class="wordmark">DOPA<em>MAXX</em></span>
      <span class="badge" id="status">MICRODOSE</span>
    </div>
    <section class="feed" id="feed"></section>
  </main>
  <script src="feed.js"></script>
</body>
</html>
