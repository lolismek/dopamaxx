<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Locked In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background: #141414;
      color: #f0ede8;
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6b6b6b;
      margin-bottom: 20px;
    }

    .heading {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: -0.01em;
      color: #e8560a;
      line-height: 1;
      margin-bottom: 12px;
    }

    .sub {
      font-size: 13px;
      font-weight: 400;
      color: #6b6b6b;
      letter-spacing: 0.01em;
      margin-bottom: 48px;
    }

    .stats {
      display: flex;
      gap: 40px;
      border-top: 1px solid #2a2a2a;
      padding-top: 24px;
    }

    .stat { text-align: center; }

    .stat-val {
      font-size: 20px;
      font-weight: 500;
      color: #f0ede8;
      font-variant-numeric: tabular-nums;
      margin-bottom: 5px;
    }
    .stat-val.dim { color: #6b6b6b; font-weight: 300; }

    .stat-lbl {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b6b6b;
    }
  </style>
</head>
<body>
  <div class="label">DopaMAXX</div>
  <div class="heading">Locked In</div>
  <div class="sub">Stay in the zone.</div>
  <div class="stats">
    <div class="stat">
      <div class="stat-val dim" id="focusVal">—</div>
      <div class="stat-lbl">Focus</div>
    </div>
    <div class="stat">
      <div class="stat-val dim" id="timerVal">--:--</div>
      <div class="stat-lbl">Time Left</div>
    </div>
  </div>
  <script>
    chrome.runtime.sendMessage({ type: "get_status" }, (s) => {
      if (!s) return;
      const fv = document.getElementById("focusVal");
      const tv = document.getElementById("timerVal");
      if (s.focusScore != null) {
        fv.textContent = s.focusScore.toFixed(2);
        fv.className = "stat-val";
      }
      if (s.timerSeconds) {
        const m = Math.floor(s.timerSeconds/60).toString().padStart(2,"0");
        const sec = (s.timerSeconds%60).toString().padStart(2,"0");
        tv.textContent = `${m}:${sec}`;
        tv.className = "stat-val";
      }
    });
  </script>
</body>
</html>
