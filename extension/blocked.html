<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DopaMAXX — Locked In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0a0a0f;
      color: #e8e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      max-width: 380px;
      padding: 0 24px;
    }
    .lock { font-size: 64px; margin-bottom: 20px; }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #fff;
      margin-bottom: 8px;
    }
    h1 span { color: #7c3aed; }
    .subtitle {
      font-size: 15px;
      color: #6b6b80;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .status {
      font-size: 12px;
      color: #4b4b60;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .bar {
      width: 100%;
      height: 3px;
      background: #1e1e2e;
      border-radius: 99px;
      margin-top: 24px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      border-radius: 99px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="lock">🔒</div>
    <h1>Dopa<span>MAXX</span></h1>
    <p class="subtitle">
      You're in <strong>Locked In</strong> mode.<br />
      Your brain says you're focused — stay there.
    </p>
    <div class="status">EEG monitoring active</div>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>
</body>
</html>
