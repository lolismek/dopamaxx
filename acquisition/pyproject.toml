[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dopamaxx-acquisition"
version = "0.1.0"
description = "DopaMAXX DSI-24 acquisition and live EEG streaming service."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pylsl>=1.16",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "httpx>=0.27",
]

[project.scripts]
dopamaxx-acquisition = "acquisition.cli:main"

[tool.setuptools]
packages = ["acquisition"]
include-package-data = true

[tool.setuptools.package-dir]
acquisition = "."

[tool.setuptools.package-data]
acquisition = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
