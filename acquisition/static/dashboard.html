<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DopaMAXX</title>
  <style>
    :root {
      --bg:      #121212;
      --s1:      #1a1a1a;
      --s2:      #222222;
      --line:    rgba(255,255,255,0.07);
      --text:    #e0deda;
      --sub:     #5a5a5a;
      --accent:  #e8560a;
      --good:    #3ecf6a;
      --bad:     #e84040;
      --scope:   #0a0a0a;
      --ph:      #3ecf6a;
      --sidebar: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); }

    body {
      color: var(--text);
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ── header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .wordmark {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .badges { display: flex; gap: 6px; align-items: center; }

    .badge {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid var(--line);
      color: var(--sub);
      white-space: nowrap;
    }
    .badge.good { color: var(--good); border-color: rgba(62,207,106,0.3); }
    .badge.warn { color: var(--accent); border-color: rgba(232,86,10,0.3); }
    .badge.bad  { color: var(--bad);  border-color: rgba(232,64,64,0.3); }

    /* ── body ── */
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0,1fr);
      flex: 1;
      overflow: hidden;
    }

    /* ── sidebar ── */
    .sidebar {
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .panel {
      border-bottom: 1px solid var(--line);
      padding: 16px;
    }

    .panel-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sub);
      margin-bottom: 4px;
    }

    /* ── big metric ── */
    .big-metric { margin-bottom: 12px; }
    .big-val {
      font-size: 40px;
      font-weight: 300;
      line-height: 1;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }
    .big-val.active { color: var(--accent); }
    .big-mood {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sub);
    }

    /* thin progress bar */
    .bar-track {
      height: 2px;
      background: var(--line);
      margin: 10px 0 12px;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.25s linear;
      width: 0%;
    }

    /* ── reward ── */
    .reward-wrap { margin-bottom: 12px; }
    .reward-center {
      height: 2px;
      background: var(--line);
      margin: 10px 0 12px;
      position: relative;
    }
    .reward-fill {
      position: absolute;
      top: 0; height: 100%;
      background: var(--accent);
      transition: left 0.25s, width 0.25s;
    }

    /* ── mode indicator ── */
    .mode-name {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.01em;
      color: var(--text);
      margin-top: 4px;
      margin-bottom: 4px;
      line-height: 1;
    }
    .mode-name.locked-in { color: var(--accent); font-weight: 500; }

    /* ── kv rows (signal quality) ── */
    .kv { display: flex; flex-direction: column; gap: 0; }
    .kv-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
    }
    .kv-row:last-child { border-bottom: none; }
    .kv-key { color: var(--sub); letter-spacing: 0.04em; }
    .kv-val { font-weight: 500; }

    /* ── sim controls ── */
    .sim-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .sim-btn {
      padding: 8px 0;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--sub);
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
    }
    .sim-btn:hover { border-color: var(--accent); color: var(--accent); }
    .sim-btn.full { grid-column: 1 / -1; }

    .sim-msg {
      margin-top: 8px;
      font-size: 10px;
      color: var(--sub);
      letter-spacing: 0.04em;
      min-height: 16px;
    }

    /* ── EEG scope ── */
    .scope-area {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .scope-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .scope-title {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--sub);
    }

    .scope-wrap {
      flex: 1;
      background: var(--scope);
      position: relative;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); }
  </style>
</head>
<body>

  <header>
    <span class="wordmark">DopaMAXX</span>
    <div class="badges">
      <span id="sourceBadge" class="badge">source</span>
      <span id="statusBadge" class="badge">connecting</span>
      <span id="streamBadge" class="badge">DSI24-EEG</span>
      <span id="rateBadge"   class="badge">— Hz</span>
      <span id="ageBadge"    class="badge">— ms</span>
    </div>
  </header>

  <div class="layout">

    <!-- ── sidebar ── -->
    <div class="sidebar">

      <div class="panel">
        <div class="panel-label">Focus</div>
        <div class="big-metric">
          <div class="big-val" id="focusVal">—</div>
          <div class="big-mood" id="focusMood">—</div>
        </div>
        <div class="bar-track"><div class="bar-fill" id="focusBar"></div></div>

        <div class="panel-label" style="margin-top:8px">Reward</div>
        <div class="reward-wrap">
          <div class="big-val" id="rewardVal" style="font-size:28px">—</div>
          <div class="big-mood" id="rewardMood">—</div>
        </div>
        <div class="reward-center">
          <div class="reward-fill" id="rewardBar" style="left:50%;width:0%"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-label">Mode</div>
        <div class="mode-name" id="modeName">Locked Out</div>
      </div>

      <div class="panel">
        <div class="panel-label">Signal</div>
        <div class="kv">
          <div class="kv-row">
            <span class="kv-key">Quality</span>
            <span class="kv-val" id="qualityVal">—</span>
          </div>
          <div class="kv-row">
            <span class="kv-key">Flat ch</span>
            <span class="kv-val" id="flatCh">0</span>
          </div>
          <div class="kv-row">
            <span class="kv-key">Clipping</span>
            <span class="kv-val" id="clipCh">0</span>
          </div>
          <div class="kv-row">
            <span class="kv-key">Rate</span>
            <span class="kv-val" id="rateVal">—</span>
          </div>
        </div>
      </div>

      <div class="panel" style="flex:1">
        <div class="panel-label">Simulator</div>
        <div class="sim-grid" style="margin-top:10px">
          <button class="sim-btn" data-state="Focused">Focused</button>
          <button class="sim-btn" data-state="Drifting">Drifting</button>
          <button class="sim-btn" data-state="Reward Hit">Reward Hit</button>
          <button class="sim-btn" data-state="Reward Miss">Reward Miss</button>
          <button class="sim-btn full" data-state="Neutral">Neutral</button>
        </div>
        <div class="sim-msg" id="simMsg"></div>
      </div>

    </div>

    <!-- ── EEG scope ── -->
    <div class="scope-area">
      <div class="scope-head">
        <span class="scope-title">Raw EEG — 19 channels</span>
        <div class="badges">
          <span id="chBadge"  class="badge">19 ch</span>
          <span id="smpBadge" class="badge">0 smp</span>
        </div>
      </div>
      <div class="scope-wrap">
        <canvas id="scopeEEG"></canvas>
      </div>
    </div>

  </div>

<script>
  const P = {
    bg:     '#121212',
    scope:  '#0a0a0a',
    line:   'rgba(255,255,255,0.07)',
    text:   '#e0deda',
    sub:    '#5a5a5a',
    accent: '#e8560a',
    good:   '#3ecf6a',
    bad:    '#e84040',
    ph:     '#3ecf6a',
    grid:   'rgba(255,255,255,0.04)',
  };

  // ── state ──
  let lastFrame = null;
  const focusHistory  = [];
  const rewardHistory = [];
  const HIST = 600;
  const rawBuf = [];
  const RAW_LEN = 1500;

  // ── helpers ──
  function $  (id) { return document.getElementById(id); }
  function txt(id, v) { const e=$(id); if(e) e.textContent = v; }
  function fmt(v, d=1) { return Number.isFinite(+v) ? (+v).toFixed(d) : '—'; }

  function badge(id, text, kind) {
    const e = $(id); if (!e) return;
    e.textContent = text;
    e.className = ('badge ' + (kind||'')).trim();
  }

  // ── WebSocket ──
  const WS_URL = `ws://${location.host}/stream/eeg`;
  let ws = null, retryT = null;

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen  = () => { badge('statusBadge','connected','good'); };
    ws.onclose = () => { badge('statusBadge','offline','bad'); retryT = setTimeout(connect, 2500); };
    ws.onerror = () => ws.close();
    ws.onmessage = e => {
      try { onFrame(JSON.parse(e.data)); } catch {}
    };
  }

  // ── frame handler ──
  function onFrame(frame) {
    lastFrame = frame;
    const meta = frame.metadata || {};
    const stats = frame.stats || {};
    const quality = frame.quality || {};
    const inf = frame.inference || {};

    // header badges
    const st = meta.connection_status || 'starting';
    badge('statusBadge', st, st==='connected'?'good':st==='degraded'?'warn':'');
    badge('sourceBadge', meta.source_mode || 'source', meta.source_mode==='simulator'?'good':'');
    badge('streamBadge', meta.stream_name || 'DSI24-EEG', '');
    badge('rateBadge',   `${fmt(meta.sample_rate_hz,0)} Hz`, 'good');
    badge('ageBadge',    stats.latest_sample_age_ms!=null ? `${fmt(stats.latest_sample_age_ms,0)} ms` : '— ms', '');
    badge('chBadge',     `${(meta.channel_labels||[]).length} ch`, '');
    badge('smpBadge',    `${stats.buffer_samples??0} smp`, '');

    // focus
    const focus = inf.focus_score;
    const fPct  = focus != null ? Math.max(0, Math.min(100, focus * 100)) : null;
    const fCol  = focus >= 0.7 ? P.good : focus <= 0.36 ? P.bad : P.accent;
    txt('focusVal',  fPct != null ? `${Math.round(fPct)}%` : '—');
    txt('focusMood', (inf.focus_mood||'—').replace(/_/g,' '));
    const fb = $('focusBar');
    if (fb) { fb.style.width = `${fPct??0}%`; fb.style.background = fPct!=null ? fCol : P.sub; }

    // reward
    const reward = inf.reward_score;
    txt('rewardVal',  reward != null ? (reward >= 0 ? '+' : '') + fmt(reward, 2) : '—');
    txt('rewardMood', (inf.reward_mood||'—').replace(/_/g,' '));
    const rf = $('rewardBar');
    if (rf && reward != null) {
      const pct = Math.max(0, Math.min(50, Math.abs(reward) * 50));
      const col  = reward >= 0 ? P.good : P.bad;
      rf.style.background = col;
      if (reward >= 0) { rf.style.left = '50%'; rf.style.width = pct + '%'; }
      else             { rf.style.left = (50-pct) + '%'; rf.style.width = pct + '%'; }
    }

    // mode (driven by extension via localStorage if available, else infer from focus)
    const storedMode = null; // extension writes mode here if wired up
    const isLockedIn = storedMode === 'locked_in';
    const modeEl = $('modeName');
    if (modeEl) {
      modeEl.textContent  = isLockedIn ? 'Locked In' : 'Locked Out';
      modeEl.className    = 'mode-name' + (isLockedIn ? ' locked-in' : '');
    }

    // signal quality
    const nCh   = (meta.channel_labels||[]).length || 19;
    const flatN  = (quality.flat_channel_labels||[]).length;
    const clipN  = (quality.clip_channel_labels||[]).length;
    const qPct   = Math.max(0, Math.round((nCh - flatN - clipN) / nCh * 100));
    const qCol   = qPct >= 90 ? P.good : qPct >= 70 ? P.accent : P.bad;
    txt('qualityVal', `${qPct}%`); $('qualityVal').style.color = qCol;
    txt('flatCh',  flatN);
    txt('clipCh',  clipN);
    txt('rateVal', `${fmt(stats.effective_rate_hz, 1)} Hz`);

    // push EEG
    const channels = frame.samples?.channels || [];
    const tRel     = frame.samples?.t_rel    || [];
    const n = channels.length ? channels[0].length : 0;
    for (let i = 0; i < n; i++) {
      rawBuf.push(channels.map(ch => ch[i] ?? 0));
      if (rawBuf.length > RAW_LEN) rawBuf.shift();
    }

    // histories
    if (focus  != null) { focusHistory.push(focus);   if (focusHistory.length  > HIST) focusHistory.shift();  }
    if (reward != null) { rewardHistory.push(reward);  if (rewardHistory.length > HIST) rewardHistory.shift(); }
  }

  // ── EEG scope ──
  function channelStats(arr) {
    let sum = 0, cnt = 0;
    for (const v of arr) { if (Number.isFinite(v)) { sum += v; cnt++; } }
    const mean = cnt ? sum / cnt : 0;
    const devs = arr.filter(Number.isFinite).map(v => Math.abs(v - mean)).sort((a, b) => a - b);
    const p95  = devs.length ? devs[Math.floor(devs.length * 0.95)] : 1;
    return { mean, scale: Math.max(p95 * 3, 1e-9) };
  }

  function drawScope() {
    const canvas = $('scopeEEG');
    if (!canvas) return;

    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(40, Math.floor(rect.width  * dpr));
    const h = Math.max(20, Math.floor(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }

    const ctx = canvas.getContext('2d');
    const frame = lastFrame;
    const labels   = frame?.metadata?.channel_labels || [];
    const channels = frame?.samples?.channels        || [];
    const t        = frame?.samples?.t_rel           || [];
    const n        = labels.length || 19;

    // background
    ctx.fillStyle = P.scope;
    ctx.fillRect(0, 0, w, h);

    // grid
    ctx.strokeStyle = P.grid;
    ctx.lineWidth   = 1;
    const cols = 12, rows = n;
    for (let i = 1; i < cols; i++) { const x = i*(w/cols); ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for (let j = 1; j < rows; j++) { const y = j*(h/rows); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

    const L = Math.round(38*dpr), R = 6, T = 4, B = 4;
    const pW = w-L-R, pH = h-T-B, rowH = pH/n;

    ctx.font = `${Math.round(9*dpr)}px Helvetica Neue,Helvetica,Arial,sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.textAlign    = 'right';

    if (!t.length || !channels.length) {
      ctx.fillStyle = P.sub;
      ctx.fillText('Waiting for signal…', L + 120*dpr, h/2);
      return;
    }

    const flatCh = lastFrame?.quality?.flat_channel_labels  || [];
    const clipCh = lastFrame?.quality?.clip_channel_labels || [];
    const minT = t[0], spanT = Math.max(0.001, (t[t.length-1]||0) - minT);

    for (let ch = 0; ch < Math.min(n, channels.length); ch++) {
      const vals    = channels[ch] || [];
      const stats   = channelStats(vals);
      const centerY = T + rowH * (ch + 0.5);
      const amp     = rowH * 0.42;
      const lname   = labels[ch] || `ch${ch+1}`;
      const isFlat  = flatCh.includes(lname);
      const isClip  = clipCh.includes(lname);

      ctx.fillStyle = isFlat ? P.accent : isClip ? P.bad : '#3a6a4a';
      ctx.fillText(lname, L - 4*dpr, centerY);

      if (vals.length < 2) continue;
      ctx.strokeStyle = isFlat ? P.accent + '88' : isClip ? P.bad + 'aa' : P.ph;
      ctx.lineWidth   = 1.0 * dpr;
      ctx.beginPath();
      for (let i = 0; i < vals.length; i++) {
        const x = L + ((t[i] - minT) / spanT) * pW;
        const y = centerY - ((vals[i] - stats.mean) / stats.scale) * amp;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  // ── sim buttons ──
  document.querySelectorAll('.sim-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const state = btn.dataset.state;
      fetch('/sim/inject', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state }),
      })
      .then(r => r.json())
      .then(d => {
        txt('simMsg', `→ ${d.state||state}`);
        setTimeout(() => txt('simMsg', ''), 3000);
      })
      .catch(() => txt('simMsg', 'error'));
    });
  });

  // ── render loop ──
  function loop() { drawScope(); requestAnimationFrame(loop); }

  connect();
  loop();
</script>
</body>
</html>
