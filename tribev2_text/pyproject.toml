[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dopamaxx-tribev2-text"
version = "0.1.0"
description = "Standalone text-to-brain-signature experiments for DopaMAXX."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
tribe = [
    "pandas>=2.0",
    "tribev2 @ git+https://github.com/facebookresearch/tribev2.git",
]

[project.scripts]
tribev2-text = "tribev2_text.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

